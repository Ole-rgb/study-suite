<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="t d">
  <title id="t">Clone the project and copy a fresh vault</title><desc id="d">Get the public repository, copy its vault template to a separate local folder, preserve your existing vault.</desc>
  <rect width="900" height="230" rx="18" fill="#f5f8fc"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24313a">Start with a safe, separate copy</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="38" y="75" width="230" height="110" rx="13" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="153" y="112" font-size="17" font-weight="700" fill="#24313a">1 · Clone</text><text x="153" y="141" font-size="14" fill="#40515c">public study-suite repo</text>
    <path d="M280 130h50" stroke="#52616b" stroke-width="3"/><path d="m326 122 12 8-12 8" fill="none" stroke="#52616b" stroke-width="3"/>
    <rect x="343" y="75" width="230" height="110" rx="13" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="458" y="112" font-size="17" font-weight="700" fill="#24313a">2 · Copy template</text><text x="458" y="141" font-size="14" fill="#40515c">vault-template/</text>
    <path d="M585 130h50" stroke="#52616b" stroke-width="3"/><path d="m631 122 12 8-12 8" fill="none" stroke="#52616b" stroke-width="3"/>
    <rect x="648" y="75" width="214" height="110" rx="13" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="755" y="112" font-size="17" font-weight="700" fill="#24313a">3 · New vault</text><text x="755" y="141" font-size="14" fill="#40515c">~/Documents/StudyVault</text>
  </g><text x="450" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#5b6670">Your existing vault stays untouched.</text>
</svg>
