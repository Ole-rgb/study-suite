<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="t d">
  <title id="t">Preview and review the initial inventory before confirming a baseline</title><desc id="d">Preview announcements, files, and events; inspect the inventory; then explicitly confirm the local baseline.</desc>
  <rect width="900" height="230" rx="18" fill="#f5f8fc"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24313a">Review before setting the baseline</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="50" y="78" width="230" height="105" rx="13" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="165" y="115" font-size="17" font-weight="700" fill="#24313a">1 · Preview</text><text x="165" y="145" font-size="14" fill="#40515c">announcements · files · events</text>
    <path d="M292 130h52" stroke="#52616b" stroke-width="3"/><path d="m340 122 12 8-12 8" fill="none" stroke="#52616b" stroke-width="3"/>
    <rect x="361" y="78" width="230" height="105" rx="13" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="476" y="115" font-size="17" font-weight="700" fill="#24313a">2 · Human review</text><text x="476" y="145" font-size="14" fill="#40515c">inspect inventory first</text>
    <path d="M603 130h52" stroke="#52616b" stroke-width="3"/><path d="m651 122 12 8-12 8" fill="none" stroke="#52616b" stroke-width="3"/>
    <rect x="672" y="78" width="180" height="105" rx="13" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="762" y="115" font-size="17" font-weight="700" fill="#24313a">3 · Confirm</text><text x="762" y="145" font-size="14" fill="#40515c">local baseline</text>
  </g><text x="450" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#5b6670">Confirmation does not mark Stud.IP items read or download files.</text>
</svg>
