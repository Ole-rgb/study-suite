<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="t d">
  <title id="t">Sign in to Stud.IP in the dedicated browser</title><desc id="d">The MCP opens Firefox; the user signs into Stud.IP directly, and then verifies authentication with Claude.</desc>
  <rect width="900" height="230" rx="18" fill="#f5f8fc"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24313a">Sign in directly — never paste a session token</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="68" y="78" width="220" height="105" rx="13" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="178" y="116" font-size="17" font-weight="700" fill="#24313a">Claude</text><text x="178" y="145" font-size="14" fill="#40515c">open_studip_login</text>
    <path d="M300 130h70" stroke="#52616b" stroke-width="3"/><path d="m366 122 12 8-12 8" fill="none" stroke="#52616b" stroke-width="3"/>
    <rect x="385" y="78" width="220" height="105" rx="13" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="495" y="116" font-size="17" font-weight="700" fill="#24313a">Dedicated Firefox</text><text x="495" y="145" font-size="14" fill="#40515c">you sign in to Stud.IP</text>
    <path d="M617 130h70" stroke="#52616b" stroke-width="3"/><path d="m683 122 12 8-12 8" fill="none" stroke="#52616b" stroke-width="3"/>
    <rect x="702" y="78" width="155" height="105" rx="13" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="779" y="116" font-size="17" font-weight="700" fill="#24313a">Verify</text><text x="779" y="145" font-size="14" fill="#40515c">authenticated</text>
  </g><text x="450" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#5b6670">The browser retains the session locally; cookies are not copied into chat.</text>
</svg>
