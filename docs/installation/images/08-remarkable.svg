<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="t d">
  <title id="t">Connect the optional reMarkable MCP in read-only local-directory mode</title><desc id="d">Install uv, add the reMarkable MCP with --local-dir, grant the desktop app's cache folder, then map notebooks and sync PDFs on request.</desc>
  <rect width="900" height="230" rx="18" fill="#f5f8fc"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24313a">Optional reMarkable workflow</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="35" y="82" width="180" height="100" rx="13" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="125" y="120" font-size="16" font-weight="700" fill="#24313a">Install uv</text><text x="125" y="148" font-size="13" fill="#40515c">provides uvx</text>
    <path d="M223 132h30" stroke="#52616b" stroke-width="3"/><path d="m249 124 12 8-12 8" fill="none" stroke="#52616b" stroke-width="3"/>
    <rect x="268" y="82" width="180" height="100" rx="13" fill="#e8ddfa" stroke="#9673a6" stroke-width="2"/><text x="358" y="120" font-size="16" font-weight="700" fill="#24313a">Add MCP</text><text x="358" y="148" font-size="13" fill="#40515c">--local-dir, restart</text>
    <path d="M456 132h30" stroke="#52616b" stroke-width="3"/><path d="m482 124 12 8-12 8" fill="none" stroke="#52616b" stroke-width="3"/>
    <rect x="501" y="82" width="180" height="100" rx="13" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="591" y="120" font-size="16" font-weight="700" fill="#24313a">Grant cache</text><text x="591" y="148" font-size="13" fill="#40515c">desktop app folder</text>
    <path d="M689 132h30" stroke="#52616b" stroke-width="3"/><path d="m715 124 12 8-12 8" fill="none" stroke="#52616b" stroke-width="3"/>
    <rect x="734" y="82" width="135" height="100" rx="13" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="801" y="120" font-size="16" font-weight="700" fill="#24313a">Map + sync</text><text x="801" y="148" font-size="13" fill="#40515c">PDFs on request</text>
  </g><text x="450" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#5b6670">Read-only; never SSH mode. Exports never overwrite and never count as coverage.</text>
</svg>
